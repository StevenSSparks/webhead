<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dodge · FriendlyPortal</title>
<style>
  body{ margin:0; background:#0e1424; color:#eaf0ff; font-family:ui-monospace,monospace; display:grid; place-items:center; min-height:100vh; }
  canvas{ background:#161f38; border:1px solid #25314f; border-radius:12px; touch-action:none; max-width:94vw; }
  a{ color:#25d0c0; } .cap{ text-align:center; margin-top:12px; }
</style>
</head>
<body>
  <div>
    <canvas id="c" width="320" height="380"></canvas>
    <p class="cap">Move to dodge the blocks · <a href="/">← FriendlyPortal</a></p>
  </div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
let px=140, blocks=[], t=0, score=0, dead=false;
function setX(clientX){ const r=c.getBoundingClientRect(); px=Math.max(0,Math.min(280,(clientX-r.left)-20)); }
c.addEventListener('mousemove',e=>setX(e.clientX));
c.addEventListener('touchmove',e=>{setX(e.touches[0].clientX);e.preventDefault();},{passive:false});
c.addEventListener('pointerdown',()=>{ if(dead){ blocks=[];score=0;dead=false;t=0; loop(); }});
function loop(){
  if(dead) return;
  t++; if(t%22===0) blocks.push({x:Math.random()*280,y:-20});
  x.clearRect(0,0,320,380);
  x.fillStyle='#6c8cff'; blocks.forEach(b=>{ b.y+=2.6+score*0.02; x.fillRect(b.x,b.y,40,18); });
  blocks=blocks.filter(b=>b.y<400);
  x.fillStyle='#25d0c0'; x.fillRect(px,350,40,20);
  for(const b of blocks){ if(b.y+18>350 && b.y<370 && b.x<px+40 && b.x+40>px){ dead=true; } }
  if(!dead) score++;
  x.fillStyle='#eaf0ff'; x.font='14px monospace'; x.fillText('score '+score,10,20);
  if(dead){ x.fillStyle='#ffcf5c'; x.font='20px monospace'; x.fillText('GAME OVER — tap to retry',26,190); return; }
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
