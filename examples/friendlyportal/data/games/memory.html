<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory · FriendlyPortal</title>
<style>
  body{ margin:0; background:#0e1424; color:#eaf0ff; font-family:ui-sans-serif,system-ui,sans-serif; display:grid; place-items:center; min-height:100vh; }
  .grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; width:min(90vw,360px); }
  .card{ aspect-ratio:1; border-radius:12px; background:#161f38; border:1px solid #25314f; display:grid; place-items:center;
    font-size:30px; cursor:pointer; user-select:none; }
  .card.up{ background:#1b2740; } .card.done{ background:#1f9d63; border-color:#1f9d63; opacity:.85; }
  a{ color:#25d0c0; } .cap{ margin-top:14px; text-align:center; }
</style>
</head>
<body>
  <div>
    <div class="grid" id="g"></div>
    <p class="cap"><span id="msg">Match all pairs</span> · <a href="/">← FriendlyPortal</a></p>
  </div>
<script>
const icons=['📡','🔒','🌐','🖥️','🎮','⚡','🧠','📶'];
let deck=icons.concat(icons).map(v=>({v,done:false}));
for(let i=deck.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [deck[i],deck[j]]=[deck[j],deck[i]]; }
const g=document.getElementById('g'), msg=document.getElementById('msg');
let flipped=[], moves=0, matched=0, lock=false;
deck.forEach((card,i)=>{
  const el=document.createElement('div'); el.className='card'; el.dataset.i=i; el.textContent='';
  el.addEventListener('click',()=>flip(i,el)); g.appendChild(el);
});
function flip(i,el){
  if(lock||deck[i].done||flipped.find(f=>f.i===i)) return;
  el.classList.add('up'); el.textContent=deck[i].v; flipped.push({i,el});
  if(flipped.length===2){
    moves++; lock=true;
    const [a,b]=flipped;
    if(deck[a.i].v===deck[b.i].v){
      deck[a.i].done=deck[b.i].done=true; matched++;
      a.el.classList.add('done'); b.el.classList.add('done');
      flipped=[]; lock=false;
      if(matched===icons.length) msg.textContent='Solved in '+moves+' moves! 🎉';
    } else {
      setTimeout(()=>{ [a,b].forEach(f=>{f.el.classList.remove('up');f.el.textContent='';}); flipped=[]; lock=false; },700);
    }
  }
}
</script>
</body>
</html>
