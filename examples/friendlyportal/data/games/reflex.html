<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reflex · FriendlyPortal</title>
<style>
  body{ margin:0; background:#0e1424; color:#eaf0ff; font-family:ui-sans-serif,system-ui,sans-serif; display:grid; place-items:center; min-height:100vh; }
  #pad{ width:min(88vw,420px); height:300px; border-radius:16px; display:grid; place-items:center; cursor:pointer; user-select:none;
    font-size:22px; font-weight:700; text-align:center; padding:20px; transition:background .1s; }
  .wait{ background:#7a2230; } .go{ background:#1f9d63; } .idle{ background:#161f38; border:1px solid #25314f; }
  a{ color:#25d0c0; } .cap{ margin-top:14px; }
</style>
</head>
<body>
  <div style="text-align:center">
    <div id="pad" class="idle">Tap to start<br><small style="font-size:14px;opacity:.7">then tap the instant it turns green</small></div>
    <p class="cap"><span id="best"></span> <a href="/">← FriendlyPortal</a></p>
  </div>
<script>
const pad=document.getElementById('pad'), best=document.getElementById('best');
let state='idle', t0=0, timer=null, record=null;
function arm(){
  state='wait'; pad.className='pad wait'; pad.textContent='Wait for green…';
  timer=setTimeout(()=>{ state='go'; pad.className='pad go'; pad.textContent='TAP!'; t0=performance.now(); }, 900+Math.random()*2000);
}
pad.addEventListener('pointerdown',()=>{
  if(state==='idle'){ arm(); return; }
  if(state==='wait'){ clearTimeout(timer); state='idle'; pad.className='pad idle'; pad.textContent='Too soon! Tap to retry'; return; }
  if(state==='go'){
    const ms=Math.round(performance.now()-t0); state='idle'; pad.className='pad idle';
    if(record===null||ms<record){ record=ms; }
    pad.textContent=ms+' ms\nTap to go again';
    best.textContent='best: '+record+' ms ·';
  }
});
</script>
</body>
</html>
