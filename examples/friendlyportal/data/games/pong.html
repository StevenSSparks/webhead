<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pong · FriendlyPortal</title>
<style>
  body{ margin:0; background:#0e1424; color:#eaf0ff; font-family:ui-monospace,monospace; display:grid; place-items:center; min-height:100vh; }
  canvas{ background:#161f38; border:1px solid #25314f; border-radius:12px; touch-action:none; max-width:94vw; }
  a{ color:#25d0c0; } .cap{ text-align:center; margin-top:12px; }
</style>
</head>
<body>
  <div>
    <canvas id="c" width="360" height="240"></canvas>
    <p class="cap">Move your mouse / finger · <a href="/">← FriendlyPortal</a></p>
  </div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
let py=95, by=120, bx=180, vx=2.6, vy=1.9, s=0;
c.addEventListener('mousemove',e=>{py=e.offsetY-25;});
c.addEventListener('touchmove',e=>{const r=c.getBoundingClientRect();py=e.touches[0].clientY-r.top-25;e.preventDefault();},{passive:false});
function loop(){
  bx+=vx; by+=vy;
  if(by<4||by>236)vy=-vy;
  if(bx>352)vx=-vx;
  if(bx<14){ if(by>py&&by<py+50){vx=-vx;s++;} else {bx=180;by=120;s=0;} }
  x.clearRect(0,0,360,240);
  x.fillStyle='#25d0c0'; x.fillRect(6,py,6,50);
  x.beginPath(); x.arc(bx,by,5,0,7); x.fill();
  x.fillStyle='#6c8cff'; x.font='14px monospace'; x.fillText('score '+s,290,20);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
